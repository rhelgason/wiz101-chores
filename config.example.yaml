# Every option. Start from configs/chores.yaml.
mode: chores                 # chores | pet | reagents
log_file: wiz101-auto.log

pet:
  auto: true                 # energy full: go play the dance game, then come back
  feed: true
  default_goal: mega         # baby, teen, adult, ancient, epic, mega, ultra
  goals: {}                  # override default_goal for one pet kind

reagents:
  enabled: true
  hop_zones: 1               # neighbouring zones to sweep after this one is empty

safety:
  stop_key: ctrl+shift+q
  pause_key: ctrl+shift+p
  max_hours: 0
  mouseless: true
