# Day plan. Copy to config.yaml (wiz101.bat does this the first time).
# The rules it follows are in PLAYBOOK.md.
#
#   wiz101-auto run -c config.yaml
#
# mode: chores    dance while energy can pay, then Splithoof seeds (Halfang after 20 couch potatoes)
#       pet       only the dance game
#       reagents  only the reagent that was asked for
mode: chores

pet:
  auto: true
  feed: true                 # feed the first snack after each win
  default_goal: adult        # the plan raises one confirm pet to mega itself
  goals: {}                  # per pet kind, lower case, e.g. {ghulture: adult}

reagents:
  enabled: true              # follow a tracked "Collect ..." quest
  hop_zones: 1               # after the named zones, walk this many gates out

safety:
  stop_key: ctrl+shift+q
  pause_key: ctrl+shift+p
  max_hours: 0               # 0 = run until stopped
  mouseless: true            # clicks without moving your real mouse
